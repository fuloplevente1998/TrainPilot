apply plugin: 'com.android.application'

android {
    namespace 'com.repforge.migrationseed'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.repforge.app.migrationseed'
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1'
    }
    sourceSets.main.assets.srcDir('../migration-fixtures')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes.release {
        signingConfig signingConfigs.release
        minifyEnabled false
    }
}

// Deliberately no app, Kotlin, AndroidX, or test-library dependency: this runner
// must execute against both original R8 mappings, before the native update.
