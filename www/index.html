 // Phase 3 phone follow-up: a local deletion tombstone prevents stale current Drive
 // snapshots/cloudBase copies from resurrecting a workout that was explicitly deleted.
 const TP3_HISTORY_TOMBSTONES='phase3HistoryTombstones';
 const tp3HistoryIdentity=x=>{
  const ids=[];
  if(x?.id)ids.push(String(x.id));
  try{const legacy=window.TrainPilotIssue18?.legacyId?.('history',x);if(legacy)ids.push(String(legacy))}catch(_){}
  let key='';try{key=typeof rf142WorkoutKey==='function'?String(rf142WorkoutKey(x)||''):''}catch(_){}
  return {ids:[...new Set(ids.filter(Boolean))],key};
 };
 const tp3HistoryTombstones=()=>{
  const rows=db.get(TP3_HISTORY_TOMBSTONES,[]);
  return Array.isArray(rows)?rows.filter(x=>x&&typeof x==='object'):[];
 };
 window.tp3HistoryIsDeleted=function(x){
  const id=tp3HistoryIdentity(x);
  if(!id.ids.length&&!id.key)return false;
  return tp3HistoryTombstones().some(t=>{
   const ids=Array.isArray(t.ids)?t.ids:[];
   return (id.key&&t.key&&id.key===t.key)||id.ids.some(v=>ids.includes(v));
  });
 };
 const tp3MarkHistoryDeleted=x=>{
  const id=tp3HistoryIdentity(x),rows=tp3HistoryTombstones().filter(t=>{
   const ids=Array.isArray(t.ids)?t.ids:[];
   return !((id.key&&t.key&&id.key===t.key)||id.ids.some(v=>ids.includes(v)));
  });
  rows.push({ids:id.ids,key:id.key,deletedAt:Date.now()});
  db.set(TP3_HISTORY_TOMBSTONES,rows.slice(-2000));
 };

 const tp3DeleteConfirm=(message)=>{
  if(typeof tp2628DialogRemove==='function')tp2628DialogRemove();
  return new Promise(resolve=>{
   const modal=document.createElement('div');modal.id='tp2628Dialog';modal.className='tp2628-dialog-backdrop tp3-delete-dialog';
   const escDialog=typeof tp2628DialogEscape==='function'?tp2628DialogEscape:esc;
   modal.innerHTML='<div class="tp2628-dialog" role="dialog" aria-modal="true" aria-labelledby="tp2628DialogTitle"><h2 id="tp2628DialogTitle">'+escDialog('Edzés törlése')+'</h2><p class="tp2628-dialog-message">'+escDialog(message)+'</p><div class="tp2628-dialog-actions"><button type="button" class="btn secondary" data-tp2628-cancel>Mégse</button><button type="button" class="btn danger" data-tp2628-confirm>Törlés</button></div></div>';
   let finished=false;
   const key=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Enter'){e.preventDefault();finish(true)}};
   const finish=value=>{if(finished)return;finished=true;document.removeEventListener('keydown',key,true);modal.remove();resolve(value)};
   const cancel=modal.querySelector('[data-tp2628-cancel]'),confirm=modal.querySelector('[data-tp2628-confirm]');
   cancel.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();finish(false)});
   const accept=e=>{e?.preventDefault?.();e?.stopPropagation?.();finish(true)};
   confirm.addEventListener('pointerup',accept,{passive:false});
   confirm.addEventListener('click',accept);
   modal.addEventListener('click',e=>{if(e.target===modal)finish(false)});
   document.addEventListener('keydown',key,true);
   document.body.appendChild(modal);
   try{if(typeof tp149TranslateFreshDom==='function')tp149TranslateFreshDom(modal)}catch(_){}
   try{confirm.focus({preventScroll:true})}catch(_){confirm.focus?.()}
  });
 };

   if(index<0)return;
