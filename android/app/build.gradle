apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jetbrains.kotlin.kapt'

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningComplete = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } && !releaseSigningComplete) {
    throw new GradleException("Original TrainPilot release signing credentials are required.")
}

android {
    namespace "com.repforge.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.repforge.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 2736
        versionName "1.3.71-native-test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "DEVELOPER_NAME", "\"\""
        buildConfigField "String", "SUPPORT_EMAIL", "\"\""
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://github.com/fuloplevente1998/TrainPilot/issues\""
    }

    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Room 2.7's shaded metadata reader accepts Kotlin metadata through 2.2.
        // Keep the compiler, Compose and serialization plugins on the compatible 2.2.21 line.
        languageVersion = "2.2"
        apiVersion = "2.2"
    }

    // A CI-only probe is optimized with the app, avoiding cross-APK R8 runtime ABIs.
    // Old hybrid AndroidJUnit sources stay untouched and are not this upgrade lane.
    if (project.hasProperty('nativeUpgradeTests')) {
        sourceSets.main.java.srcDir('src/nativeUpgrade/java')
        buildTypes.release.proguardFiles('native-upgrade-proguard.pro')
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-dev"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':shared')

    implementation "androidx.core:core-ktx:${rootProject.ext.androidxCoreVersion}"
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.androidxActivityVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.androidxLifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.androidxLifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.androidxLifecycleVersion}"
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.androidxNavigationVersion}"

    // Jetpack Compose BOM
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // Room Database
    implementation "androidx.room:room-runtime:${rootProject.ext.androidxRoomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.androidxRoomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.androidxRoomVersion}"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.androidxDataStoreVersion}"

    // Coroutines & Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutinesVersion}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:${rootProject.ext.coroutinesVersion}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"

    // Wearable Data Layer & Remote Interactions
    implementation "com.google.android.gms:play-services-wearable:${rootProject.ext.playServicesWearableVersion}"
    implementation "androidx.wear:wear-remote-interactions:1.1.0"
    implementation "com.google.guava:guava:33.4.8-android"

    // Google Auth Identity (Drive & Calendar OAuth2)
    implementation "com.google.android.gms:play-services-auth:22.0.0"

    // ExifInterface for WorkoutPhotos
    implementation "androidx.exifinterface:exifinterface:1.4.0"

    implementation "androidx.work:work-runtime-ktx:2.10.1"

    // Restore the same licensed SDK and runtime dependencies used by 1.3.71.
    implementation files('libs/samsung-health-data-api-1.1.0.aar')
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-parcelize-runtime:2.2.21'

    // Unit & Robolectric Tests
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
}
