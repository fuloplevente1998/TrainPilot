apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningValues = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseSigningComplete = releaseSigningValues.every { it != null && !it.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (releaseTaskRequested && !releaseSigningComplete) {
    throw new GradleException("Release signing requires ANDROID_KEYSTORE_PATH, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.")
}

def playBuild = System.getenv("TRAINPILOT_PLAY_BUILD") == "true"
def policyUrl = System.getenv("TRAINPILOT_PRIVACY_POLICY_URL") ?: ""
def supportEmail = System.getenv("TRAINPILOT_SUPPORT_EMAIL") ?: ""
def developerName = System.getenv("TRAINPILOT_DEVELOPER_NAME") ?: ""
if (playBuild) {
    if (!(policyUrl ==~ /https:\/\/[^\s]+/) || !(supportEmail ==~ /[^\s@]+@[^\s@]+\.[^\s@]+/) || developerName.trim().isEmpty()) {
        throw new GradleException("Play build requires public HTTPS privacy URL, support email and developer identity.")
    }
    if (!releaseSigningComplete) throw new GradleException("Play upload signing configuration is missing.")
    def keys = java.security.KeyStore.getInstance(file(releaseKeystorePath), releaseStorePassword.toCharArray())
    def certificate = keys.getCertificate(releaseKeyAlias)
    if (certificate == null || certificate.subjectX500Principal.name.toLowerCase().contains("cn=android debug")) {
        throw new GradleException("Play builds cannot use the legacy Android Debug certificate.")
    }
}
def javaLiteral = { value -> groovy.json.JsonOutput.toJson(value) }

android {
    namespace "com.repforge.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "PRIVACY_POLICY_URL", javaLiteral(policyUrl)
        buildConfigField "String", "SUPPORT_EMAIL", javaLiteral(supportEmail)
        buildConfigField "String", "DEVELOPER_NAME", javaLiteral(developerName)
        applicationId "com.repforge.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2718
        versionName "1.2.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }

dependencies {
    // Samsung's read-only Data SDK; the phone implementation remains Java.
    implementation files('libs/samsung-health-data-api-1.1.0.aar')
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    implementation 'org.jetbrains.kotlin:kotlin-parcelize-runtime:2.1.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) { apply plugin: 'com.google.gms.google-services' }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
