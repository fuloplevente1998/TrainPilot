name: Phase 7 Performance Baseline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainpilot-phase7-perf-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify Progress daily filters and latest chart position
        run: node tests/browser/progress-177-issue60.cjs
      - name: Run reproducible benchmark
        run: node tests/browser/phase7-performance-19.cjs | tee phase7-metrics.log
      - name: Reject major structural and timing regressions
        run: node tests/browser/phase7-performance-budget.cjs phase7-metrics.log
      - name: Trace repeated history callers
        run: node tests/browser/phase7-history-callers-19.cjs
      - name: Profile cold Coach open
        run: node tests/browser/phase7-coach-cold-19.cjs
      - name: Archive performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-performance-${{ github.run_id }}
          path: phase7-metrics.log
          if-no-files-found: ignore
          retention-days: 30
