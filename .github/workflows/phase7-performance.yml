name: Phase 7 Performance Baseline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'perf/**' ]
  workflow_dispatch:
    inputs:
      navigation_profile:
        description: 'Collect cold/warm navigation CPU and layout profiles against the last device-tested #235 source'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: trainpilot-phase7-perf-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Benchmark validated v1.0.6 main on the same runner
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/trainpilot-perf-baseline"
          git worktree add --detach "$BASE_DIR" ef09c5ee44b61902a7bb265f8ef2b3d2ea8de88e
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          cd "$BASE_DIR"
          node "$GITHUB_WORKSPACE/tests/browser/phase7-performance-19.cjs" | tee "$GITHUB_WORKSPACE/phase7-before.log"
      - name: Verify Progress daily filters and latest chart position
        run: node tests/browser/progress-177-issue60.cjs
      - name: Run reproducible benchmark
        run: node tests/browser/phase7-performance-19.cjs | tee phase7-metrics.log
      - name: Reject major structural and timing regressions
        run: node tests/browser/phase7-performance-budget.cjs phase7-metrics.log
      - name: Trace repeated history callers
        run: node tests/browser/phase7-history-callers-19.cjs
      - name: Profile cold Coach open
        run: node tests/browser/phase7-coach-cold-19.cjs
      - name: Profile navigation against the latest device-tested source
        if: github.event_name == 'workflow_dispatch' && inputs.navigation_profile
        shell: bash
        run: |
          set -euo pipefail
          NAV_BASE_DIR="$RUNNER_TEMP/trainpilot-nav-before"
          git worktree add --detach "$NAV_BASE_DIR" 8a49c047041752055e11eec94aa8812f051a2f0b
          TRAINPILOT_NAV_ROOT="$NAV_BASE_DIR/www" TRAINPILOT_NAV_OUT=navigation-profile/before node tests/browser/navigation-cpu-profile-235.cjs > navigation-before.log
          TRAINPILOT_NAV_OUT=navigation-profile/after node tests/browser/navigation-cpu-profile-235.cjs > navigation-after.log
      - name: Archive performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-performance-${{ github.run_id }}
          path: |
            phase7-before.log
            phase7-metrics.log
            navigation-before.log
            navigation-after.log
            navigation-profile/
          if-no-files-found: ignore
          retention-days: 30
