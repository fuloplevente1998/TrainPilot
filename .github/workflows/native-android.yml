# G10-only own-branch QA workflow. NOT TO BE MERGED into migration.
name: Native G10 progress/photo scoped QA

on:
  workflow_dispatch:
  pull_request:
    branches: [feat/native-android-migration]
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

concurrency:
  group: native-g10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-debug:
    name: G10 debug APK and targeted JVM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-gradle-v2-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            native-gradle-v2-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
            native-gradle-v2-${{ runner.os }}-
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and build G10 APK pair
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run targeted G10 JVM tests (includes historical projections)
        run: |
          ./gradlew --no-daemon --stacktrace -PnativeTestDiagnostics :app:testDebugUnitTest \
            --tests 'com.repforge.app.NativeProgressQueryTest' \
            --tests 'com.repforge.app.NativeProgressPhotoRangeTest'
      - name: Hash exact debug APKs
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > g10-apk-sha256.txt
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > g10-source-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-G10-JVM-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/g10-apk-sha256.txt
            android/g10-source-head.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Native-G10-Debug-APKs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  phone-ui:
    name: G10 + 3 existing Cardio Progress UI tests / API35
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: Native-G10-Debug-APKs
          path: g10/apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real targeted emulator instrumentation and unchanged screencaps
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 - <<'PY'
            import hashlib
            import importlib.util
            import json
            import os
            from pathlib import Path
            import re
            import subprocess
            import time
            import xml.etree.ElementTree as ET

            out = Path("g10/results")
            shots = out / "screenshots"
            shots.mkdir(parents=True, exist_ok=True)
            apk = Path("g10/apks/app/build/outputs/apk/debug/app-debug.apk")
            test_apk = Path("g10/apks/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk")
            def sha(path):
                return hashlib.sha256(path.read_bytes()).hexdigest()
            def adb(*args, check=True):
                return subprocess.run(["adb", *args], capture_output=True, check=check, timeout=35).stdout

            manifest = {
                "sourceHead": os.environ["SOURCE_HEAD"],
                "appSha256": sha(apk), "testApkSha256": sha(test_apk),
                "api": adb("shell", "getprop", "ro.build.version.sdk").decode().strip(),
                "imageOrigin": "unmodified-adb-exec-out-screencap-p",
                "fixture": "isolated-synthetic-g10",
                "screenshots": [], "result": "failed"
            }
            process = None
            try:
                adb("install", "-r", "-t", str(apk))
                adb("install", "-r", "-t", str(test_apk))
                for p in ("POST_NOTIFICATIONS", "ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION"):
                    adb("shell", "pm", "grant", "com.repforge.app", "android.permission."+p, check=False)
                adb("shell", "rm", "-f", "/data/local/tmp/trainpilot-shot-request",
                    "/data/local/tmp/trainpilot-shot-ack")
                selector = ("com.repforge.app.NativeCardioProgressUiTest,"
                            "com.repforge.app.NativeProgressPhotoRangeUiTest")
                seen = set()
                with (out / "instrumentation.txt").open("wb") as raw_file:
                    process = subprocess.Popen(["adb", "shell", "am", "instrument", "-w", "-r",
                        "-e", "class", selector,
                        "com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner"],
                        stdout=raw_file, stderr=subprocess.STDOUT)
                    deadline = time.monotonic() + 1500
                    while process.poll() is None:
                        if time.monotonic() >= deadline:
                            process.kill()
                            raise TimeoutError("G10 emulator test timed out")
                        req = adb("shell", "cat", "/data/local/tmp/trainpilot-shot-request",
                            check=False).decode(errors="replace").strip()
                        if req.startswith("{"):
                            try:
                                data = json.loads(req)
                            except json.JSONDecodeError:
                                time.sleep(.2)
                                continue
                            name = data.get("name", "")
                            if not re.fullmatch(r"[a-z0-9_]{1,120}", name):
                                raise RuntimeError("invalid screenshot request name")
                            if name not in seen:
                                focus = adb("shell", "dumpsys", "window").decode(errors="replace")
                                if "com.repforge.app/" not in focus:
                                    raise RuntimeError("No foreground TrainPilot app for screenshot")
                                png = adb("exec-out", "screencap", "-p")
                                if not png.startswith(b"\x89PNG\r\n\x1a\n") or len(png) < 100:
                                    raise RuntimeError("Not an unmodified PNG from adb")
                                file = shots / (name + ".png")
                                file.write_bytes(png)
                                manifest["screenshots"].append({**data, "path": str(file),
                                    "sha256": sha(file), "bytes": len(png)})
                                seen.add(name)
                                adb("shell", "sh", "-c",
                                    "printf %s " + name + " > /data/local/tmp/trainpilot-shot-ack")
                        time.sleep(.15)
                log = (out / "instrumentation.txt").read_text(errors="replace")
                spec = importlib.util.spec_from_file_location("gate", "scripts/native/phone-ui-gate.py")
                gate = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(gate)
                valid = gate.report(log, out / "instrumentation-derived.xml")
                xml = ET.parse(out / "instrumentation-derived.xml").getroot()
                if (not valid or process.returncode != 0 or
                    int(xml.attrib["tests"]) != 6 or
                    any(int(xml.attrib[x]) != 0 for x in ("failures", "errors", "skipped")) or
                    len(manifest["screenshots"]) < 3):
                    raise RuntimeError("6/6 terminal tests and >=3 real screenshots required")
                manifest["result"] = "success"
            finally:
                if process is not None and process.poll() is None:
                    process.kill()
                (out / "manifest.json").write_text(json.dumps(manifest, indent=2))
                (out / "logcat.txt").write_bytes(adb("logcat", "-d", "-t", "3000", check=False))
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-G10-Phone-Evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: g10/results/
          if-no-files-found: warn
