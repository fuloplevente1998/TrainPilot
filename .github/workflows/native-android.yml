# QA-only branch-local workflow. Never integrate this delta into migration/main.
name: Scoped Home Recovery QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-home-recovery-provenance

permissions:
  contents: read

concurrency:
  group: native-home-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  home-build-jvm:
    name: Home debug APK and bounded JVM regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Android 36 compile platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble real phone app and UI test APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee home-debug-build.log
      - name: Run only impacted JVM tests and existing Home/Coach regression
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PnativeTestDiagnostics :app:testDebugUnitTest \
            --tests 'com.repforge.app.NativeHomeRecoveryPresentationTest' \
            --tests 'com.repforge.app.NativeHomeDailyCountTest' \
            --tests 'com.repforge.app.NativeHomeRepositoryTest' \
            --tests 'com.repforge.app.NativeCoachReadinessTest' \
            --tests 'com.repforge.app.NativeCoachSignalsTest' \
            2>&1 | tee home-jvm-tests.log
      - name: Hash APKs and logs
        if: always()
        working-directory: android
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > home-apk-sha256.txt || true
          sha256sum home-*.log > home-log-sha256.txt || true
      - name: Upload raw compile and JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-Build-JVM-${{ github.sha }}
          path: |
            android/home-*.log
            android/home-*-sha256.txt
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload real compiled debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-APK-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  home-phone-ui:
    name: API35 real Home synthetic-provider UI and raw screenshots
    needs: home-build-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: Native-Home-Recovery-APK-${{ github.sha }}
          path: phone-ui/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare screenshot-handshake host for existing Home regression
        shell: bash
        run: |
          mkdir -p phone-ui/results/raw phone-ui/results/host-captures
          cat > phone-ui/home-test-host.py <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import time

          output = pathlib.Path("phone-ui/results")
          app = next(pathlib.Path("phone-ui/apk").rglob("app-debug.apk"))
          tests = next(pathlib.Path("phone-ui/apk").rglob("app-debug-androidTest.apk"))
          def adb(*args, timeout=15, check=True):
              return subprocess.run(("adb", *args), stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, timeout=timeout, check=check).stdout
          def run_suite(selector, log_name, checkpoint=False):
              adb("shell", "rm", "-f", "/data/local/tmp/trainpilot-shot-request",
                  "/data/local/tmp/trainpilot-shot-ack")
              seen = set()
              with (output / log_name).open("wb") as log:
                  cmd = ["adb", "shell", "am", "instrument", "-w", "-r",
                         "-e", "class", selector,
                         "com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner"]
                  proc = subprocess.Popen(cmd, stdout=log, stderr=subprocess.STDOUT)
                  try:
                      deadline = time.monotonic() + 420
                      while proc.poll() is None:
                          if time.monotonic() > deadline:
                              raise TimeoutError("Home UI instrumentation exceeded deadline")
                          if checkpoint:
                              response = adb("shell", "cat", "/data/local/tmp/trainpilot-shot-request",
                                             check=False).decode(errors="replace").strip()
                              if response.startswith("{"):
                                  try:
                                      request = json.loads(response)
                                  except json.JSONDecodeError:
                                      time.sleep(.1)
                                      continue
                                  name = request.get("name", "")
                                  if not re.fullmatch("[a-z0-9_]{1,120}", name):
                                      raise ValueError("Invalid screenshot checkpoint: " + name)
                                  if name not in seen:
                                      focus = next((line.strip() for line in
                                          adb("shell", "dumpsys", "window").decode(errors="replace").splitlines()
                                          if "mCurrentFocus=" in line), "")
                                      if "com.repforge.app/" not in focus:
                                          raise RuntimeError("Home screenshot not foreground: " + focus)
                                      data = adb("exec-out", "screencap", "-p", timeout=12)
                                      if not data.startswith(bytes((137,80,78,71,13,10,26,10))) or len(data) < 512:
                                          raise RuntimeError("Missing raw framebuffer image")
                                      shot = output / "host-captures" / (name + ".png")
                                      shot.write_bytes(data)
                                      seen.add(name)
                                      adb("shell", "sh", "-c",
                                          "printf '%s' '" + name + "' > /data/local/tmp/trainpilot-shot-ack")
                          time.sleep(.15)
                      return proc.returncode, seen
                  finally:
                      if proc.poll() is None:
                          proc.terminate()
                          try:
                              proc.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              proc.kill()
                              proc.wait(timeout=5)

          adb("install", "-r", str(app), timeout=90)
          adb("install", "-r", str(tests), timeout=90)
          results = []
          cases = [
              ("com.repforge.app.NativeHomeRecoveryUiTest", "instrumentation.txt", False),
              ("com.repforge.app.NativePhoneNavigationTest#homeTracksPlanSettingsProgramAndHistoryChangesAndStartsTheDisplayedSchedule",
               "existing-home-instrumentation.txt", True)
          ]
          for cls, filename, checkpoint in cases:
              code, shots = run_suite(cls, filename, checkpoint)
              results.append({"testClass": cls, "adbExitCode": code,
                              "hostScreenshotCount": len(shots)})
          for name in ("samsung", "fallback", "none", "locale-hu", "locale-en", "locale-de", "locale-ro"):
              target = output / "raw" / ("native-home-" + name + ".png")
              target.write_bytes(adb("exec-out", "cat", "/sdcard/Download/native-home-" + name + ".png", timeout=30))
              if target.stat().st_size < 512:
                  raise RuntimeError("PNG capture missing: " + name)
          (output / "host-result.json").write_text(json.dumps(results, indent=2))
          print("Scoped host tests:", results)
          PY
      - name: Run isolated Home UI tests on disposable API35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 phone-ui/home-test-host.py
      - name: Validate real UI terminal results, original PNGs, and evidence hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          results = pathlib.Path('phone-ui/results')
          expected = {
              'verifiedSamsungOnRealHomeAndRawScreenshot',
              'realHomeDisplaysTrainPilotFallbackNotFabricatedSamsung',
              'emptyJournalDisplaysDashAndNoData',
              'localeChangesPreserveEnergyIdentityAndRenderHuEnDeRoLabels',
          }
          def terminal(file):
              source = (results / file).read_text(errors='replace')
              names, actual, selected = [], [], None
              for line in source.splitlines():
                  if line.startswith('INSTRUMENTATION_STATUS: test='):
                      selected = line.split('=', 1)[1].strip()
                  if line.startswith('INSTRUMENTATION_STATUS_CODE:'):
                      code = int(line.split(':', 1)[1].strip())
                      if code <= 0:
                          actual.append((selected, code))
                          names.append(selected)
              assert 'INSTRUMENTATION_CODE: -1' in source, 'Runner did not finish: ' + file
              assert names and not any(name is None for name in names), 'Missing case: ' + file
              return actual
          new = terminal('instrumentation.txt')
          old = terminal('existing-home-instrumentation.txt')
          passed = [name for name, code in new if code == 0]
          failures = [(name, code) for name, code in new if code != 0]
          suite = ET.Element('testsuite', name='NativeHomeRecoveryUiTest',
                             tests=str(len(new)), failures=str(len(failures)), errors='0', skipped='0')
          for name, code in new:
              case = ET.SubElement(suite, 'testcase', classname='NativeHomeRecoveryUiTest', name=name)
              if code != 0:
                  ET.SubElement(case, 'failure', message=str(code))
          ET.ElementTree(suite).write(results / 'native-home-junit.xml', encoding='utf-8', xml_declaration=True)
          print('Home tests', new, 'existing Home regression', old)
          assert not failures and set(passed) == expected and len(passed) == 4, 'Home new UI cases did not all pass'
          assert len(old) == 1 and old[0][1] == 0 and 'homeTracksPlanSettings' in old[0][0], 'Existing Home UI failed'
          import json
          host = json.loads((results / 'host-result.json').read_text())
          assert len(host) == 2 and all(x['adbExitCode'] == 0 for x in host), host
          assert host[1]['hostScreenshotCount'] >= 2, 'Existing Home screenshots missing'
          assert len(list((results / 'host-captures').glob('*.png'))) >= 2, 'No raw host screenshots'
          shots = ['samsung','fallback','none','locale-hu','locale-en','locale-de','locale-ro']
          for name in shots:
              shot = results / 'raw' / ('native-home-' + name + '.png')
              assert shot.stat().st_size > 512 and shot.read_bytes()[:8] == bytes((137,80,78,71,13,10,26,10)), shot
          PY
          (cd phone-ui/results && sha256sum instrumentation.txt existing-home-instrumentation.txt native-home-junit.xml host-result.json raw/*.png host-captures/*.png > SHA256SUMS.txt)
      - name: Upload unmodified PNG + raw runner log + parsed XML + SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-UI-${{ github.sha }}
          path: phone-ui/results/
          if-no-files-found: warn
