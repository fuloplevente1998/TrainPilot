# QA-only integration branch workflow. Do not integrate this delta into migration/main.
name: Scoped G01 Home Integration QA

on:
  workflow_dispatch:
  push:
    branches:
      - review/native-g01-home-integration-ready
    paths:
      - '.github/workflows/native-android.yml'
      - 'android/app/src/main/java/com/repforge/app/ui/home/HomeScreen.kt'
      - 'android/app/src/main/java/com/repforge/app/ui/home/HomeViewModel.kt'
      - 'android/app/src/main/java/com/repforge/app/ui/home/NativeHomeRecoveryPresentation.kt'
      - 'android/app/src/main/res/values/native_home_recovery.xml'
      - 'android/app/src/main/res/values-en/native_home_recovery.xml'
      - 'android/app/src/main/res/values-de/native_home_recovery.xml'
      - 'android/app/src/main/res/values-ro/native_home_recovery.xml'
      - 'android/app/src/nativePhoneUiTest/java/com/repforge/app/NativeHomeRecoveryUiTest.kt'
      - 'android/app/src/test/java/com/repforge/app/NativeHomeRecoveryPresentationTest.kt'

permissions:
  contents: read

concurrency:
  group: g01-home-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g01-build-jvm:
    name: G01 debug APK and targeted JVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 compile platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug app and native phone UI test APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee g01-debug-build.log
      - name: Run exact G01 JVM classes
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PnativeTestDiagnostics :app:testDebugUnitTest \
            --tests 'com.repforge.app.NativeHomeRecoveryPresentationTest' \
            --tests 'com.repforge.app.NativeHomeDailyCountTest' \
            --tests 'com.repforge.app.NativeHomeRepositoryTest' \
            --tests 'com.repforge.app.NativeCoachReadinessTest' \
            --tests 'com.repforge.app.NativeCoachSignalsTest' \
            2>&1 | tee g01-jvm-tests.log
      - name: Hash APK and raw logs
        if: always()
        working-directory: android
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > g01-apk-sha256.txt || true
          sha256sum g01-debug-build.log g01-jvm-tests.log > g01-log-sha256.txt || true
      - name: Upload JVM XML and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G01-Home-Build-JVM-${{ github.sha }}
          path: |
            android/g01-*.log
            android/g01-*-sha256.txt
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - name: Upload compiled APK pair
        uses: actions/upload-artifact@v4
        with:
          name: G01-Home-APK-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  g01-api35:
    name: API35 G01 Home UI and navigation regression
    needs: g01-build-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: G01-Home-APK-${{ github.sha }}
          path: phone-ui/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated host runner
        shell: bash
        run: |
          mkdir -p phone-ui/results/raw phone-ui/results/host-captures
          cat > phone-ui/g01-host.py <<'PY'
          import json, pathlib, re, subprocess, time
          out = pathlib.Path("phone-ui/results")
          app = next(pathlib.Path("phone-ui/apk").rglob("app-debug.apk"))
          tests = next(pathlib.Path("phone-ui/apk").rglob("app-debug-androidTest.apk"))
          def adb(*args, timeout=20, check=True):
              return subprocess.run(("adb", *args), stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    timeout=timeout, check=check).stdout
          def suite(selector, log_name, checkpoints=False):
              adb("shell", "rm", "-f", "/data/local/tmp/trainpilot-shot-request", "/data/local/tmp/trainpilot-shot-ack")
              seen=set()
              with (out/log_name).open("wb") as log:
                  proc=subprocess.Popen(["adb","shell","am","instrument","-w","-r","-e","class",selector,
                      "com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner"],stdout=log,stderr=subprocess.STDOUT)
                  try:
                      deadline=time.monotonic()+420
                      while proc.poll() is None:
                          if time.monotonic()>deadline: raise TimeoutError("G01 instrumentation deadline exceeded")
                          if checkpoints:
                              raw=adb("shell","cat","/data/local/tmp/trainpilot-shot-request",check=False).decode(errors="replace").strip()
                              if raw.startswith("{"):
                                  try: request=json.loads(raw)
                                  except json.JSONDecodeError:
                                      time.sleep(.1); continue
                                  name=request.get("name","")
                                  if not re.fullmatch("[a-z0-9_]{1,120}",name): raise ValueError("invalid screenshot checkpoint: "+name)
                                  if name not in seen:
                                      focus=next((line.strip() for line in adb("shell","dumpsys","window").decode(errors="replace").splitlines() if "mCurrentFocus=" in line),"")
                                      if "com.repforge.app/" not in focus: raise RuntimeError("TrainPilot not foreground: "+focus)
                                      png=adb("exec-out","screencap","-p",timeout=12)
                                      if not png.startswith(bytes((137,80,78,71,13,10,26,10))) or len(png)<512: raise RuntimeError("invalid framebuffer PNG")
                                      (out/"host-captures"/(name+".png")).write_bytes(png); seen.add(name)
                                      adb("shell","printf '%s' '"+name+"' > /data/local/tmp/trainpilot-shot-ack")
                          time.sleep(.15)
                      return proc.returncode,seen
                  finally:
                      if proc.poll() is None:
                          proc.terminate()
                          try: proc.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              proc.kill(); proc.wait(timeout=5)
          adb("install","-r",str(app),timeout=90); adb("install","-r",str(tests),timeout=90)
          runs=[]
          for selector,log_name,checkpoints in [
              ("com.repforge.app.NativeHomeRecoveryUiTest","instrumentation.txt",False),
              ("com.repforge.app.NativePhoneNavigationTest#homeTracksPlanSettingsProgramAndHistoryChangesAndStartsTheDisplayedSchedule","existing-home-instrumentation.txt",True)]:
              code,shots=suite(selector,log_name,checkpoints)
              runs.append({"selector":selector,"adbExitCode":code,"hostScreenshotCount":len(shots)})
          for name in ("samsung","fallback","none","locale-hu","locale-en","locale-de","locale-ro"):
              target=out/"raw"/("native-home-"+name+".png")
              target.write_bytes(adb("exec-out","cat","/sdcard/Download/native-home-"+name+".png",timeout=30))
              if target.stat().st_size<512 or target.read_bytes()[:8]!=bytes((137,80,78,71,13,10,26,10)): raise RuntimeError("missing raw Home PNG: "+name)
          (out/"host-result.json").write_text(json.dumps(runs,indent=2))
          print("G01 host runs:",runs)
          PY
      - name: Run disposable API35 UI gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 phone-ui/g01-host.py
      - name: Parse terminal evidence and hash raw screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path("phone-ui/results")
          expected={"verifiedSamsungOnRealHomeAndRawScreenshot","realHomeDisplaysTrainPilotFallbackNotFabricatedSamsung",
                    "emptyJournalDisplaysDashAndNoData","localeChangesPreserveEnergyIdentityAndRenderHuEnDeRoLabels"}
          def terminal(name):
              source=(out/name).read_text(errors="replace"); selected=None; actual=[]
              for line in source.splitlines():
                  if line.startswith("INSTRUMENTATION_STATUS: test="): selected=line.split("=",1)[1].strip()
                  if line.startswith("INSTRUMENTATION_STATUS_CODE:"):
                      code=int(line.split(":",1)[1].strip())
                      if code<=0: actual.append((selected,code))
              assert "INSTRUMENTATION_CODE: -1" in source, "runner incomplete: "+name
              assert actual and all(n for n,_ in actual), "missing terminal test: "+name
              return actual
          new=terminal("instrumentation.txt"); old=terminal("existing-home-instrumentation.txt")
          failures=[(n,c) for n,c in new if c!=0]; passed={n for n,c in new if c==0}
          suite=ET.Element("testsuite",name="NativeHomeRecoveryUiTest",tests=str(len(new)),failures=str(len(failures)),errors="0",skipped="0")
          for n,c in new:
              case=ET.SubElement(suite,"testcase",classname="NativeHomeRecoveryUiTest",name=n)
              if c!=0: ET.SubElement(case,"failure",message=str(c))
          ET.ElementTree(suite).write(out/"native-home-junit.xml",encoding="utf-8",xml_declaration=True)
          assert not failures and passed==expected and len(new)==4, new
          assert len(old)==1 and old[0][1]==0 and "homeTracksPlanSettings" in old[0][0], old
          host=json.loads((out/"host-result.json").read_text())
          assert len(host)==2 and all(x["adbExitCode"]==0 for x in host),host
          assert host[1]["hostScreenshotCount"]>=2,host
          assert len(list((out/"host-captures").glob("*.png")))>=2
          print("G01 Home UI:",new,"existing Home regression:",old)
          PY
          (cd phone-ui/results && sha256sum instrumentation.txt existing-home-instrumentation.txt native-home-junit.xml host-result.json raw/*.png host-captures/*.png > SHA256SUMS.txt)
      - name: Upload raw UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G01-Home-UI-${{ github.sha }}
          path: phone-ui/results/
          if-no-files-found: error
