# QA-only branch-local workflow. Never integrate this delta into migration/main.
name: Scoped Home Recovery QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-home-recovery-provenance

permissions:
  contents: read

concurrency:
  group: native-home-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  home-build-jvm:
    name: Home debug APK and bounded JVM regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Android 36 compile platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble real phone app and UI test APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee home-debug-build.log
      - name: Run only impacted JVM tests and existing Home/Coach regression
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PnativeTestDiagnostics :app:testDebugUnitTest \
            --tests 'com.repforge.app.NativeHomeRecoveryPresentationTest' \
            --tests 'com.repforge.app.NativeHomeDailyCountTest' \
            --tests 'com.repforge.app.NativeHomeRepositoryTest' \
            --tests 'com.repforge.app.NativeCoachReadinessTest' \
            --tests 'com.repforge.app.NativeCoachSignalsTest' \
            2>&1 | tee home-jvm-tests.log
      - name: Hash APKs and logs
        if: always()
        working-directory: android
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > home-apk-sha256.txt || true
          sha256sum home-*.log > home-log-sha256.txt || true
      - name: Upload raw compile and JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-Build-JVM-${{ github.sha }}
          path: |
            android/home-*.log
            android/home-*-sha256.txt
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload real compiled debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-APK-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  home-phone-ui:
    name: API35 real Home synthetic-provider UI and raw screenshots
    needs: home-build-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: Native-Home-Recovery-APK-${{ github.sha }}
          path: phone-ui/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Home UI tests on disposable API35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p phone-ui/results/raw
            adb install -r phone-ui/apk/app-debug.apk
            adb install -r phone-ui/apk/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.repforge.app.NativeHomeRecoveryUiTest com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner | tee phone-ui/results/instrumentation.txt
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET, pathlib
            raw=pathlib.Path('phone-ui/results/instrumentation.txt').read_text()
            blocks=re.findall(r'INSTRUMENTATION_STATUS: test=(.*?)\r?\n(?:.*?\n)*?INSTRUMENTATION_STATUS_CODE: (-?\d+)', raw)
            passed=[name for name,code in blocks if code=='0']
            failing=[(name,code) for name,code in blocks if code in ('-2','-3','-4')]
            names=set(passed)
            expected={'verifiedSamsungOnRealHomeAndRawScreenshot','realHomeDisplaysTrainPilotFallbackNotFabricatedSamsung','emptyJournalDisplaysDashAndNoData','localeChangesPreserveEnergyIdentityAndRenderHuEnDeRoLabels'}
            suite=ET.Element('testsuite',name='NativeHomeRecoveryUiTest',tests=str(len(passed)+len(failing)),failures=str(len(failing)),skipped='0')
            for name in passed: ET.SubElement(suite,'testcase',classname='NativeHomeRecoveryUiTest',name=name)
            for name,code in failing:
              case=ET.SubElement(suite,'testcase',classname='NativeHomeRecoveryUiTest',name=name)
              ET.SubElement(case,'failure',message=code).text=raw[-5000:]
            ET.ElementTree(suite).write('phone-ui/results/native-home-junit.xml',encoding='utf-8',xml_declaration=True)
            print('terminal PASS',len(passed),'FAIL/SKIP',failing,'found',names)
            if set(passed)!=expected or failing or 'INSTRUMENTATION_CODE: -1' not in raw:
              raise SystemExit('Home UI terminal gate failed')
            PY
            # One existing Home navigation/state regression, without rerunning the full phone suite.
            adb shell am instrument -w -r -e class 'com.repforge.app.NativePhoneNavigationTest#homeTracksPlanSettingsProgramAndHistoryChangesAndStartsTheDisplayedSchedule' com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner | tee phone-ui/results/existing-home-instrumentation.txt
            python3 - <<'PY'
            import pathlib, re
            s=pathlib.Path('phone-ui/results/existing-home-instrumentation.txt').read_text()
            statuses=re.findall(r'INSTRUMENTATION_STATUS_CODE: (-?\d+)',s)
            assert statuses.count('0')==1 and not any(x in statuses for x in ['-2','-3','-4']) and 'INSTRUMENTATION_CODE: -1' in s, statuses
            PY
            for name in samsung fallback none locale-hu locale-en locale-de locale-ro; do
              adb pull "/sdcard/Download/native-home-$name.png" "phone-ui/results/raw/native-home-$name.png"
              test -s "phone-ui/results/raw/native-home-$name.png"
            done
            (cd phone-ui/results && sha256sum instrumentation.txt existing-home-instrumentation.txt native-home-junit.xml raw/*.png > SHA256SUMS.txt)
      - name: Upload unmodified PNG + raw runner log + parsed XML + SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Home-Recovery-UI-${{ github.sha }}
          path: phone-ui/results/
          if-no-files-found: warn
