name: Native Android and Wear OS APK

on:
  workflow_dispatch:
    inputs:
      phone_display_size:
        description: 'Optional phone portrait WIDTHxHEIGHT pixels (e.g. 1080x2392); requires density'
        type: string
        default: ''
      phone_display_density:
        description: 'Actual phone Android display DPI; required when setting display size'
        type: string
        default: ''
      phone_font_scale:
        description: 'Optional Android font scale, e.g. 1.0'
        type: string
        default: ''
  push:
    branches:
      - feat/native-android-migration
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'
      - 'scripts/run-native-wear-ui.sh'
      - 'scripts/run-native-signed-upgrade.sh'
      - 'scripts/native/phone-ui-gate.py'
      - 'scripts/native/evidence-summary.py'
      - 'tests/native/test_phone_ui_gate_report.py'
      - 'tests/native/test_evidence_summary.py'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'
      - 'scripts/run-native-wear-ui.sh'
      - 'scripts/run-native-signed-upgrade.sh'
      - 'scripts/native/phone-ui-gate.py'
      - 'scripts/native/evidence-summary.py'
      - 'tests/native/test_phone_ui_gate_report.py'
      - 'tests/native/test_evidence_summary.py'

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-debug:
    name: Build phone and Wear OS debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate native phone runner and evidence parser
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s tests/native -p 'test_phone_ui_gate_report.py'
          python3 -m unittest discover -s tests/native -p 'test_evidence_summary.py'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Preserve resolved dependencies even when a later regression test fails.
      # setup-java's post cache only saves a successful job, which made each fix
      # download the same Kotlin/Android toolchain again.
      - name: Restore native Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-gradle-v3-${{ runner.os }}-jdk21-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            native-gradle-v3-${{ runner.os }}-jdk21-
            native-gradle-v2-${{ runner.os }}-
            native-gradle-v1-${{ runner.os }}-
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: Build native phone and watch debug APKs
        run: ./gradlew --continue --no-daemon --stacktrace -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebug

      - name: Run native unit tests
        run: ./gradlew --continue --no-daemon --stacktrace -PnativeTestDiagnostics :app:testDebugUnitTest :wear:testDebugUnitTest :shared:testDebugUnitTest

      - name: Prepare existing release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/trainpilot-native-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build same-key signed native updates
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :wear:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.fragment > wear-fragment-dependencies.txt
          ./gradlew --no-daemon --stacktrace -PnativeUpgradeTests :app:assembleRelease :wear:assembleRelease :wear:assembleDebugAndroidTest :migration-seed:assembleRelease
      - name: Verify update package version and signer continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PHONE="app/build/outputs/apk/release/app-release.apk"
          WEAR="wear/build/outputs/apk/release/wear-release.apk"
          test -s "$PHONE"
          test -s "$WEAR"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$PHONE" > phone-native-badging.txt
          "$AAPT" dump badging "$WEAR" > wear-native-badging.txt
          grep -q "package: name='com.repforge.app'" phone-native-badging.txt
          grep -q "package: name='com.repforge.app'" wear-native-badging.txt
          grep -q "versionCode='2736'" phone-native-badging.txt
          grep -q "versionCode='2736'" wear-native-badging.txt
          grep -q "versionName='1.3.71-native-test'" phone-native-badging.txt
          grep -q "versionName='1.3.71-native-test'" wear-native-badging.txt
          "$SIGNER" verify --verbose "$PHONE"
          "$SIGNER" verify --verbose "$WEAR"
          mkdir -p "$RUNNER_TEMP/native-signer-baseline"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.0.0.apk' --dir "$RUNNER_TEMP/native-signer-baseline"
          OLD="$RUNNER_TEMP/native-signer-baseline/TrainPilot-1.0.0.apk"
          echo "485817d3c33b0623b030ad919fb5e07af27d5e5890a3f67fb8e4dbe4b729f22a  $OLD" | sha256sum --check --
          ORIGINAL="$(python3 ../scripts/apk_signer_cert.py "$OLD")"
          test -n "$ORIGINAL"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$PHONE")"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$WEAR")"
          SEED_APK="migration-seed/build/outputs/apk/release/migration-seed-release.apk"
          "$SIGNER" verify --verbose "$SEED_APK"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$SEED_APK")"
          echo "Original release signing identity verified."
          sha256sum "$PHONE" "$WEAR" > native-apk-sha256.txt
      - name: Upload independent old-release seed runner
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Migration-Seed
          path: android/migration-seed/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload Wear UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-UI-Test
          path: android/wear/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/trainpilot-native-release.jks"
      - name: Upload signed phone update
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Signed-Update
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed Wear update
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Signed-Update
          path: android/wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: error
      - name: Upload APK verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Update-Verification
          path: |
            android/*-native-badging.txt
            android/native-apk-sha256.txt
            android/wear-fragment-dependencies.txt
          if-no-files-found: error
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Tests-${{ github.sha }}
          path: |
            android/**/build/test-results/
            android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload phone debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload native phone UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-UI-Test
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Upload Wear OS debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Debug
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Preserve native Gradle dependencies
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  signed-upgrade:
    name: Signed ${{ matrix.baseline.tag }} to native data upgrade
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        baseline:
          - tag: v1.3.71
            sha256: f3fc054d9e2142fc7919b0e7beee8c2db35527de2fcb85406c23ab23141e5e68
          - tag: v1.3.71-perf-20261022
            sha256: 850b5e1e597e574dbf5cf55cf82721a3f77879447db9852fa056d2b889d50570
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Signed-Update
          path: upgrade/phone
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Migration-Seed
          path: upgrade/seed
      - name: Download verified original release
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ matrix.baseline.tag }}
          BASELINE_SHA256: ${{ matrix.baseline.sha256 }}
        run: |
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.3.71.apk' --dir upgrade/original
          echo "$BASELINE_SHA256  upgrade/original/TrainPilot-1.3.71.apk" | sha256sum --check --
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore API 35 upgrade AVD snapshot
        id: upgrade-avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: native-avd-upgrade-v1-${{ runner.os }}-api35-google_apis-x86_64-pixel_2
      - name: Create API 35 upgrade AVD snapshot
        if: steps.upgrade-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: echo "Upgrade AVD snapshot ready."
      - name: Install original, seed, and update without uninstalling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -no-snapshot-save
          script: bash scripts/run-native-signed-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrainPilot-Native-Signed-Upgrade-Results-${{ matrix.baseline.tag }}-${{ github.sha }}
          path: upgrade/results/
          if-no-files-found: error

  wear-ui:
    name: Preserved native Wear round UI
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Debug
          path: wear-ui/app
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Wear-UI-Test
          path: wear-ui/test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore Wear API 30 AVD snapshot
        id: wear-avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: native-avd-wear-v1-${{ runner.os }}-api30-android-wear-x86-wearos_small_round
      - name: Create Wear API 30 AVD snapshot
        if: steps.wear-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wearos_small_round
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: echo "Wear AVD snapshot ready."
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          WEAR_SHARD: ${{ matrix.shard }}
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wearos_small_round
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -no-snapshot-save
          script: bash scripts/run-native-wear-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrainPilot-Native-Wear-UI-Results-${{ github.sha }}-${{ matrix.shard }}
          path: wear-ui/results/
          if-no-files-found: error

  phone-ui:
    name: Native phone Compose UI and unmodified screenshots
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Debug
          path: phone-ui/app
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Phone-UI-Test
          path: phone-ui/test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore phone API 35 AVD snapshot
        id: phone-avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: native-avd-phone-v1-${{ runner.os }}-api35-google_apis-x86_64-${{ inputs.phone_display_size != '' && 'pixel_7' || 'default' }}
      - name: Create phone API 35 AVD snapshot
        if: steps.phone-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: ${{ inputs.phone_display_size != '' && 'pixel_7' || '' }}
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 6000M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Phone AVD snapshot ready."
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          PHONE_UI_DISPLAY_SIZE: ${{ inputs.phone_display_size || '' }}
          PHONE_UI_DISPLAY_DENSITY: ${{ inputs.phone_display_density || '' }}
          PHONE_UI_FONT_SCALE: ${{ inputs.phone_font_scale || '' }}
        with:
          # wm size cannot exceed the small default AVD's hardware scaling limit.
          # A real-size hardware profile is required before applying owner geometry.
          profile: ${{ inputs.phone_display_size != '' && 'pixel_7' || '' }}
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 6000M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: python3 scripts/native/phone-ui-gate.py --app phone-ui/app/app-debug.apk --tests phone-ui/test/app-debug-androidTest.apk --output phone-ui/results --commit "$GITHUB_SHA" --display-size "$PHONE_UI_DISPLAY_SIZE" --display-density "$PHONE_UI_DISPLAY_DENSITY" --font-scale "$PHONE_UI_FONT_SCALE"
      - name: Upload raw phone UI evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-UI-Evidence
          path: phone-ui/results/
          if-no-files-found: error
