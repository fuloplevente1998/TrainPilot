name: Native Android and Wear OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-android-migration
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

jobs:
  native-debug:
    name: Build phone and Wear OS debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: Build native phone and watch debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug
      - name: Upload phone debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload Wear OS debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Debug
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
