name: Native Android and Wear OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-android-migration
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-debug:
    name: Build phone and Wear OS debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: Build native phone and watch debug APKs
        run: ./gradlew --continue --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Run native unit tests
        run: ./gradlew --continue --no-daemon --stacktrace :app:testDebugUnitTest :wear:testDebugUnitTest :shared:testDebugUnitTest

      - name: Prepare existing release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/trainpilot-native-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build same-key signed native updates
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace -PnativeUpgradeTests :app:assembleRelease :wear:assembleRelease :app:assembleReleaseAndroidTest :wear:assembleDebugAndroidTest
      - name: Verify update package version and signer continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PHONE="app/build/outputs/apk/release/app-release.apk"
          WEAR="wear/build/outputs/apk/release/wear-release.apk"
          test -s "$PHONE"
          test -s "$WEAR"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$PHONE" > phone-native-badging.txt
          "$AAPT" dump badging "$WEAR" > wear-native-badging.txt
          grep -q "package: name='com.repforge.app'" phone-native-badging.txt
          grep -q "package: name='com.repforge.app'" wear-native-badging.txt
          grep -q "versionCode='2736'" phone-native-badging.txt
          grep -q "versionCode='2736'" wear-native-badging.txt
          "$SIGNER" verify --verbose "$PHONE"
          "$SIGNER" verify --verbose "$WEAR"
          mkdir -p "$RUNNER_TEMP/native-signer-baseline"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.0.0.apk' --dir "$RUNNER_TEMP/native-signer-baseline"
          OLD="$RUNNER_TEMP/native-signer-baseline/TrainPilot-1.0.0.apk"
          echo "485817d3c33b0623b030ad919fb5e07af27d5e5890a3f67fb8e4dbe4b729f22a  $OLD" | sha256sum --check --
          ORIGINAL="$(python3 ../scripts/apk_signer_cert.py "$OLD")"
          test -n "$ORIGINAL"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$PHONE")"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$WEAR")"
          TEST_APK="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          "$SIGNER" verify --verbose "$TEST_APK"
          test "$ORIGINAL" = "$(python3 ../scripts/apk_signer_cert.py "$TEST_APK")"
          echo "Original release signing identity verified."
          sha256sum "$PHONE" "$WEAR" > native-apk-sha256.txt
      - name: Upload signed upgrade test APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Upgrade-Test
          path: android/app/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error
      - name: Upload Wear UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-UI-Test
          path: android/wear/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/trainpilot-native-release.jks"
      - name: Upload signed phone update
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Signed-Update
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed Wear update
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Signed-Update
          path: android/wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: error
      - name: Upload APK verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Update-Verification
          path: |
            android/*-native-badging.txt
            android/native-apk-sha256.txt
          if-no-files-found: error
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Tests-${{ github.sha }}
          path: |
            android/**/build/test-results/
            android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload phone debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload Wear OS debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Debug
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  signed-upgrade:
    name: Original signed 1.3.71 to native data upgrade
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Phone-Signed-Update
          path: upgrade/phone
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Upgrade-Test
          path: upgrade/test
      - name: Download verified original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.71 --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.3.71.apk' --dir upgrade/original
          echo 'f3fc054d9e2142fc7919b0e7beee8c2db35527de2fcb85406c23ab23141e5e68  upgrade/original/TrainPilot-1.3.71.apk' | sha256sum --check --
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install original, seed, and update without uninstalling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/run-native-signed-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrainPilot-Native-Signed-Upgrade-Results-${{ github.sha }}
          path: upgrade/results/
          if-no-files-found: error

  wear-ui:
    name: Preserved native Wear round UI
    needs: native-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Wear-Debug
          path: wear-ui/app
      - uses: actions/download-artifact@v4
        with:
          name: TrainPilot-Native-Wear-UI-Test
          path: wear-ui/test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          WEAR_SHARD: ${{ matrix.shard }}
        with:
          api-level: 30
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/run-native-wear-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrainPilot-Native-Wear-UI-Results-${{ github.sha }}-${{ matrix.shard }}
          path: wear-ui/results/
          if-no-files-found: error
