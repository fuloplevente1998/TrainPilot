name: Native Health foreground refresh (isolated)

on:
  pull_request:
    paths:
      - 'android/app/src/**'
      - '.github/workflows/native-health-auto-refresh.yml'
  push:
    branches:
      - feat/native-health-auto-refresh
    paths:
      - 'android/app/src/**'
      - '.github/workflows/native-health-auto-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-unit:
    name: Health JVM test contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Set up Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run real Health JVM tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.repforge.app.NativeHealthAutoRefreshTest' \
            --tests 'com.repforge.app.NativeHealthAutoRefreshAdmissionTest' \
            --tests 'com.repforge.app.NativeHealthAutoRefreshPublicationTest' \
            --tests 'com.repforge.app.NativeHealthAutoRefreshBackupTest' \
            --tests 'com.repforge.app.NativeHealthRefreshWindowTest' \
            --tests 'com.repforge.app.NativeHealthRefreshTest'
      - name: Save independent Health JVM evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Health-Unit-${{ github.sha }}
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  health-compose-ui:
    name: Real Health screen and preference persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Set up Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile native phone and Compose instrumentation APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PnativePhoneUiTests :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run only the real Health toggle on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: "cd android && ./gradlew --no-daemon -PnativePhoneUiTests :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.repforge.app.NativeHealthAutoRefreshUiTest"
      - name: Save raw UI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Health-Compose-UI-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: warn
