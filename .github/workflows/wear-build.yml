name: Wear OS Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/wear-os'
    paths:
      - 'android/wear/**'
      - 'android/app/src/main/java/com/repforge/app/**'
      - 'android/app/build.gradle'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'www/app.js'
      - 'www/index.html'
      - '.github/workflows/wear-build.yml'

permissions:
  contents: read

concurrency:
  group: trainpilot-wear-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  wear-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run sync

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build phone + Wear OS debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: TrainPilot-Wear-integration-debug-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
          retention-days: 14
