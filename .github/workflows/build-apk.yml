name: Release Gate + TrainPilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/phase2-issue16-169'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: trainpilot-release-gate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Materialize temporary release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/trainpilot-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Verify release metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json');
          const src=require('./SOURCE_VERSION.json');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const versionName=gradle.match(/versionName\s+"([^"]+)"/)?.[1];
          const versionCode=Number(gradle.match(/versionCode\s+(\d+)/)?.[1]);
          if(pkg.version!==src.version||pkg.version!==versionName) throw new Error('Version mismatch');
          if(Number(src.versionCode)!==versionCode) throw new Error('versionCode mismatch');
          if(process.env.GITHUB_REF_TYPE==='tag'){
            const expectedTag=`v${pkg.version}`;
            if(process.env.GITHUB_REF_NAME!==expectedTag) throw new Error(`Tag/version mismatch: expected ${expectedTag}, got ${process.env.GITHUB_REF_NAME}`);
          }
          console.log(`Version metadata OK: ${pkg.version} (${versionCode})`);
          NODE

      - name: Run TrainPilot regression suite
        run: npm test

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run full Chromium UI regression suite
        run: npm run test:ui

      - name: Stamp source commit
        run: node -e "const fs=require('fs'),s=require('./SOURCE_VERSION.json');s.sourceCommit=process.env.GITHUB_SHA;fs.writeFileSync('SOURCE_VERSION.json',JSON.stringify(s,null,2)+'\n')"

      - name: Sync Capacitor Android project
        run: npm run sync

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(node -p "require('./SOURCE_VERSION.json').versionCode")"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.repforge.app'" apk-badging.txt
          grep -q "versionCode='$CODE'" apk-badging.txt
          grep -q "versionName='$VERSION'" apk-badging.txt
          "$SIGNER" verify --verbose "$APK"
          unzip -p "$APK" assets/public/app.js > /tmp/packaged-app.js
          cmp www/app.js /tmp/packaged-app.js
          cp "$APK" "TrainPilot-$VERSION.apk"
          git archive --format=zip -o "TrainPilot-$VERSION-source.zip" HEAD
          zip -q -d "TrainPilot-$VERSION-source.zip" SOURCE_VERSION.json || true
          zip -q "TrainPilot-$VERSION-source.zip" SOURCE_VERSION.json
          sha256sum "TrainPilot-$VERSION.apk" "TrainPilot-$VERSION-source.zip" > SHA256SUMS.txt

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/trainpilot-release.jks"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="$GITHUB_REF_NAME"
          FILES=(
            "TrainPilot-$VERSION.apk"
            "TrainPilot-$VERSION-source.zip"
            "SHA256SUMS.txt"
            "apk-badging.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}"               --verify-tag               --generate-notes               --title "TrainPilot $VERSION"
          fi

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-${{ github.run_id }}-${{ github.sha }}
          path: |
            TrainPilot-*.apk
            TrainPilot-*-source.zip
            SHA256SUMS.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14
