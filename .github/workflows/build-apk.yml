name: Release Gate + TrainPilot APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: trainpilot-release-gate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Chromium UI (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify UI shard runner
        run: node --test scripts/ui-runner.test.cjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run full Chromium UI regression shard
        run: npm run test:ui -- --shard ${{ matrix.shard }}/6
      - name: Upload UI evidence and test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TrainPilot-ui-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            ui-evidence/*.png
            ui-results/*.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    needs: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Materialize temporary release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/trainpilot-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Verify release metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json');
          const src=require('./SOURCE_VERSION.json');
          const phone=fs.readFileSync('android/app/build.gradle','utf8');
          const wear=fs.readFileSync('android/wear/build.gradle','utf8');
          const phoneVersion=phone.match(/versionName\s+"([^"]+)"/)?.[1];
          const phoneCode=Number(phone.match(/versionCode\s+(\d+)/)?.[1]);
          const wearVersion=wear.match(/versionName\s+"([^"]+)"/)?.[1];
          const wearCode=Number(wear.match(/versionCode\s+(\d+)/)?.[1]);
          const expectedVersion=src.displayVersion||src.version;
          if(pkg.version!==src.version||phoneVersion!==expectedVersion) throw new Error('Phone version mismatch');
          if(Number(src.versionCode)!==phoneCode) throw new Error('Phone versionCode mismatch');
          if(wearVersion!==expectedVersion) throw new Error('Wear version mismatch');
          if(wearCode!==phoneCode) throw new Error('Wear versionCode mismatch');
          if(process.env.GITHUB_REF_TYPE==='tag'){
            const expectedTag=`v${pkg.version}`;
            if(process.env.GITHUB_REF_NAME!==expectedTag) throw new Error(`Tag/version mismatch: expected ${expectedTag}, got ${process.env.GITHUB_REF_NAME}`);
          }
          console.log(`Version metadata OK: phone + Wear ${pkg.version} (${phoneCode})`);
          NODE

      - name: Run TrainPilot regression suite
        run: npm test

      - name: Stamp source commit
        run: node -e "const fs=require('fs'),s=require('./SOURCE_VERSION.json');s.sourceCommit=process.env.GITHUB_SHA;fs.writeFileSync('SOURCE_VERSION.json',JSON.stringify(s,null,2)+'\\n')"

      - name: Sync Capacitor Android project
        run: npm run sync

      - name: Build phone + Wear OS release APKs
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest :app:assembleRelease :wear:assembleRelease

      - name: Verify APKs and package source
        shell: bash
        run: |
          set -euo pipefail
          PHONE_APK=android/app/build/outputs/apk/release/app-release.apk
          WEAR_APK=android/wear/build/outputs/apk/release/wear-release.apk
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(node -p "require('./SOURCE_VERSION.json').versionCode")"
          DISPLAY_VERSION="$(node -p "require('./SOURCE_VERSION.json').displayVersion || require('./package.json').version")"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"

          "$AAPT" dump badging "$PHONE_APK" > phone-apk-badging.txt
          grep -q "package: name='com.repforge.app'" phone-apk-badging.txt
          grep -q "versionCode='$CODE'" phone-apk-badging.txt
          grep -q "versionName='$DISPLAY_VERSION'" phone-apk-badging.txt

          "$AAPT" dump badging "$WEAR_APK" > wear-apk-badging.txt
          grep -q "package: name='com.repforge.app'" wear-apk-badging.txt
          grep -q "versionCode='$CODE'" wear-apk-badging.txt
          grep -q "versionName='$DISPLAY_VERSION'" wear-apk-badging.txt

          "$SIGNER" verify --verbose "$PHONE_APK"
          "$SIGNER" verify --verbose "$WEAR_APK"

          unzip -p "$PHONE_APK" assets/public/app.js > /tmp/packaged-app.js
          cmp www/app.js /tmp/packaged-app.js

          cp "$PHONE_APK" "TrainPilot-$VERSION.apk"
          cp "$WEAR_APK" "TrainPilot-$VERSION-wear.apk"
          git archive --format=zip -o "TrainPilot-$VERSION-source.zip" HEAD
          zip -q -d "TrainPilot-$VERSION-source.zip" SOURCE_VERSION.json || true
          zip -q "TrainPilot-$VERSION-source.zip" SOURCE_VERSION.json
          sha256sum "TrainPilot-$VERSION.apk" "TrainPilot-$VERSION-wear.apk" "TrainPilot-$VERSION-source.zip" > SHA256SUMS.txt

      - name: Verify release signer continuity with v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.0.0.apk' --dir "$RUNNER_TEMP/previous-release"
          OLD_APK="$RUNNER_TEMP/previous-release/TrainPilot-1.0.0.apk"
          PHONE_APK="android/app/build/outputs/apk/release/app-release.apk"
          WEAR_APK="android/wear/build/outputs/apk/release/wear-release.apk"
          echo "485817d3c33b0623b030ad919fb5e07af27d5e5890a3f67fb8e4dbe4b729f22a  $OLD_APK" | sha256sum --check --
          OLD_CERT="$(python3 scripts/apk_signer_cert.py "$OLD_APK")"
          PHONE_CERT="$(python3 scripts/apk_signer_cert.py "$PHONE_APK")"
          WEAR_CERT="$(python3 scripts/apk_signer_cert.py "$WEAR_APK")"
          test -n "$OLD_CERT"
          test -n "$PHONE_CERT"
          test -n "$WEAR_CERT"
          echo "Original certificate: $OLD_CERT"
          echo "Phone certificate:    $PHONE_CERT"
          echo "Wear certificate:     $WEAR_CERT"
          test "$OLD_CERT" = "$PHONE_CERT" || { echo "::error::Phone signing certificate differs from public v1.0.0"; exit 1; }
          test "$PHONE_CERT" = "$WEAR_CERT" || { echo "::error::Wear signing certificate differs from phone certificate"; exit 1; }
          echo "Phone + Wear release signing certificates match public v1.0.0"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/trainpilot-release.jks"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          # Main publishes each new version once. If the release already exists,
          # refresh its documented notes while keeping verified binary assets unchanged.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && gh release view "$TAG" >/dev/null 2>&1; then
            NOTES_FILE="docs/releases/$TAG.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE" --title "TrainPilot $VERSION"
              echo "Release $TAG notes refreshed; existing assets kept unchanged."
            else
              echo "Release $TAG already exists; keeping its assets unchanged."
            fi
            exit 0
          fi
          FILES=(
            "TrainPilot-$VERSION.apk"
            "TrainPilot-$VERSION-wear.apk"
            "TrainPilot-$VERSION-source.zip"
            "SHA256SUMS.txt"
            "phone-apk-badging.txt"
            "wear-apk-badging.txt"
          )
          NOTES=(--generate-notes)
          NOTES_FILE="docs/releases/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES=(--notes-file "$NOTES_FILE")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release create "$TAG" "${FILES[@]}" --verify-tag "${NOTES[@]}" --title "TrainPilot $VERSION"
            else
              gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" "${NOTES[@]}" --title "TrainPilot $VERSION"
            fi
          fi

      - name: Upload APKs and source
        uses: actions/upload-artifact@v7
        with:
          name: TrainPilot-${{ github.run_id }}-${{ github.sha }}
          path: |
            TrainPilot-*.apk
            TrainPilot-*-source.zip
            SHA256SUMS.txt
            phone-apk-badging.txt
            wear-apk-badging.txt
          if-no-files-found: error
          retention-days: 14
