# Fast installable APK for same-repository native-phone PRs.
# This is NOT a release or a substitute for native-android.yml's 7-job gate.
name: Native fast signed PHONE APK

on:
  pull_request:
    branches: [feat/native-android-migration]
    paths:
      - 'android/app/**'
      - 'android/shared/**'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - '.github/workflows/native-fast-phone-apk.yml'
  push:
    branches: [feat/native-android-migration]
    paths:
      - 'android/app/**'
      - 'android/shared/**'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/**'
      - '.github/workflows/native-fast-phone-apk.yml'

permissions:
  contents: read

# Separate concurrency from the full native gate: neither cancels the other.
concurrency:
  group: native-fast-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-phone:
    name: Quick signed phone APK (not the full test gate)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same Gradle dependency cache key as the canonical native-android workflow.
      # A cache miss affects speed, never signature validation or correctness.
      - name: Reuse verified native Gradle dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-gradle-v3-${{ runner.os }}-jdk21-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            native-gradle-v3-${{ runner.os }}-jdk21-
            native-gradle-v2-${{ runner.os }}-
            native-gradle-v1-${{ runner.os }}-

      - uses: android-actions/setup-android@v4
      - name: Install required native Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack existing signing identity into temporary runner file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/native-fast-phone-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build PHONE release only with canonical native upgrade flags
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PnativeUpgradeTests :app:assembleRelease

      - name: Verify installable package, version and original signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PHONE="app/build/outputs/apk/release/app-release.apk"
          test -s "$PHONE"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$PHONE" > native-fast-phone-badging.txt
          grep -q "package: name='com.repforge.app'" native-fast-phone-badging.txt
          grep -q "versionCode='2736'" native-fast-phone-badging.txt
          grep -q "versionName='1.3.71-native-test'" native-fast-phone-badging.txt
          "$SIGNER" verify --verbose "$PHONE"
          mkdir -p "$RUNNER_TEMP/native-fast-phone-original"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'TrainPilot-1.0.0.apk' --dir "$RUNNER_TEMP/native-fast-phone-original"
          ORIGINAL="$RUNNER_TEMP/native-fast-phone-original/TrainPilot-1.0.0.apk"
          echo "485817d3c33b0623b030ad919fb5e07af27d5e5890a3f67fb8e4dbe4b729f22a  $ORIGINAL" | sha256sum --check --
          ORIGINAL_CERT="$(python3 ../scripts/apk_signer_cert.py "$ORIGINAL")"
          PHONE_CERT="$(python3 ../scripts/apk_signer_cert.py "$PHONE")"
          test -n "$ORIGINAL_CERT"
          test "$ORIGINAL_CERT" = "$PHONE_CERT"
          sha256sum "$PHONE" > native-fast-phone-sha256.txt
          echo "Commit: $GITHUB_SHA" > native-fast-phone-source.txt
          echo "Verification: original production signer, APK signature and unchanged native package/version" >> native-fast-phone-source.txt
          echo "Limit: fast APK candidate; full Android/Wear and signed-upgrade gates remain mandatory" >> native-fast-phone-source.txt

      - name: Remove signing keystore even after a failed build
        if: always()
        run: rm -f "$RUNNER_TEMP/native-fast-phone-release.jks"

      - name: Upload fast signed phone APK and provenance (never publish release)
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Native-FAST-Phone-Signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/native-fast-phone-badging.txt
            android/native-fast-phone-sha256.txt
            android/native-fast-phone-source.txt
          if-no-files-found: error
          retention-days: 14
