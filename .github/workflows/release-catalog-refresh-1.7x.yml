name: Refresh TrainPilot 1.7.x Releases

on:
  push:
    branches:
      - 'feat/release-catalog-refresh-1.7x'

permissions:
  contents: write
  actions: read

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish preserved validated releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/publish-release-catalog-1.7x.sh
