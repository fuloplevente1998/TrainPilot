name: P0 Phone WebView Background Regression

on:
  workflow_dispatch:
  push:
    branches: ['fix/p0-162-157-safe-wear-sync', 'perf/**']
    paths: ['www/app.js', 'android/app/**', '.github/workflows/phone-execution-ui.yml']

permissions:
  contents: read

concurrency:
  group: phone-execution-ui-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  phone-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run actual WebView and native execution regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            # Match Redmi Note 15 5G physical pixels and approximate 450 dpi UI density.
            adb shell wm size 1080x2392
            adb shell wm density 450
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.repforge.app android.permission.POST_NOTIFICATIONS
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # Record actual Android system screenshots before the regression suite.
            adb shell am instrument -w -e class com.repforge.app.TrainPilotMainEmulatorScreenshotsTest com.repforge.app.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-instrumentation.txt
            mkdir -p emulator-evidence
            adb pull /sdcard/Android/data/com.repforge.app/files/main-emulator-5f026a5 emulator-evidence/
            python3 - <<'PY'
            from pathlib import Path
            import struct
            shots=sorted(Path('emulator-evidence').rglob('*.png'))
            assert len(shots)>=20, f'Expected at least 20 actual Android emulator images, found {len(shots)}'
            for p in shots:
                with p.open('rb') as f: h=f.read(24)
                assert h[:8]==b'\x89PNG\r\n\x1a\n',f'Not PNG: {p}'
                dimensions=struct.unpack('>II',h[16:24])
                assert dimensions==(1080,2392),f'Wrong emulator resolution {p}: {dimensions}'
            print(f'Verified {len(shots)} native emulator screenshots at 1080x2392')
            PY
            # Keep original WebView execution checks on this isolated testing branch.
            bash scripts/measure-phone-cold-startup.sh
            bash scripts/run-phone-webview-ui.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Phone-WebView-${{ github.run_id }}-${{ github.sha }}
          path: |
            emulator-evidence/
            emulator-instrumentation.txt
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
