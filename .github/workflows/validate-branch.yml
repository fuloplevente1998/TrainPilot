name: Quick TrainPilot Validation

on:
  workflow_dispatch:
  push:
    # Native debug/unit/signed-update/emulator gates run in native-android.yml.
    branches-ignore: ['feat/native-android-migration']
    paths-ignore:
      - 'android/wear/**'
      - 'docs/WEAR_OS.md'
      - '.github/workflows/wear-build.yml'
      - '.github/workflows/wear-release.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: trainpilot-quick-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app-target:
    uses: ./.github/workflows/classify-app-source.yml

  quick:
    needs: app-target
    if: ${{ needs.app-target.outputs.legacy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate coordinated phone and Wear versions
        env:
          TP_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/check-version-policy.test.cjs scripts/release-metadata.test.cjs
          if [[ "$TP_VERSION_BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$TP_VERSION_BASE" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$TP_VERSION_BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$TP_VERSION_BASE"
            node scripts/check-version-policy.cjs --base "$TP_VERSION_BASE"
          else
            node scripts/check-version-policy.cjs
          fi
          node scripts/release-metadata.cjs --check
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in www/*.js; do node -c "$f"; done
          for f in tests/*.cjs; do node -c "$f"; done
      - name: Run fast TrainPilot regression suite
        run: npm test
